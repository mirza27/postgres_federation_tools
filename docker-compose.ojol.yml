version: '3.8'
name: ${APP_NAME}

services:
  old_db:
    container_name: old_ojol
    image: postgres:16
    ports:
      - "${OLD_OUT_PORT}:5432"
    volumes:
      - ojol-old-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${OLD_DATABASE}
      - POSTGRES_USER=${OLD_USERNAME}
      - POSTGRES_PASSWORD=${OLD_PASSWORD}
    networks:
      - ojol_network

  new_db:
    container_name: new_ojol
    image: postgres:16
    ports:
      - "${NEW_OUT_PORT}:5432"
    volumes:
      - ojol-new-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${NEW_DATABASE}
      - POSTGRES_USER=${NEW_USERNAME}
      - POSTGRES_PASSWORD=${NEW_PASSWORD}
    networks:
      - ojol_network
  
volumes:
  ojol-old-data:
  ojol-new-data:

networks:
  ojol_network:
    driver: bridge
    name: ojol_network